version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: homei_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-homei_db}
      POSTGRES_USER: ${DB_USER:-homei_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-homei_secret_2026}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-homei_user} -d ${DB_NAME:-homei_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homei_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-homei_db}
      DB_USER: ${DB_USER:-homei_user}
      DB_PASSWORD: ${DB_PASSWORD:-homei_secret_2026}
      SESSION_SECRET: ${SESSION_SECRET:-homei_session_s3cret_k3y_2026}
    volumes:
      - .:/app
      - /app/node_modules
      - uploads:/app/public/uploads
    command: sh -c "npm run migrate && npm run seed && npm run dev"

volumes:
  pgdata:
    driver: local
  uploads:
    driver: local
